<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>جاري الفتح...</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Tahoma,Arial,sans-serif;background:#121212;color:#eee}
.sp{width:38px;height:38px;border:4px solid #333;border-top-color:#0077b6;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 14px}
@keyframes r{to{transform:rotate(360deg)}}
p{font-size:14px;color:#aaa;text-align:center}
</style>
</head>
<body>
<div><div class="sp"></div><p>جاري الفتح...</p></div>

<script src="/config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
  // الرابط المطلوب: فقط روابط موقعك
  var target = PN_CONFIG.siteUrl;
  try {
    var u = new URL(new URLSearchParams(location.search).get('u') || '', location.href);
    var site = new URL(PN_CONFIG.siteUrl).hostname.replace(/^www\./, '');
    var host = u.hostname.replace(/^www\./, '');
    if (u.protocol === 'https:' && (host === site || host.slice(-(site.length + 1)) === '.' + site)) target = u.href;
  } catch(e) {}

  var gone = false;
  function go(){ if (gone) return; gone = true; location.replace(target); }
  setTimeout(go, 2500); // لا ننتظر أكثر من ثانيتين ونصف

  try {
    var saved = localStorage.getItem('pn_fs');
    if (!('Notification' in window) || Notification.permission !== 'granted') return go();

    firebase.initializeApp(PN_CONFIG.firebase);
    navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' })
      .then(function(reg){ return firebase.messaging().getToken({ vapidKey: PN_CONFIG.vapidKey, serviceWorkerRegistration: reg }); })
      .then(function(t){
        if (!t || t === saved) return go();
        var ua = navigator.userAgent;
        var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var platform = isIOS ? 'ios' : (/Android/i.test(ua) ? 'android' : 'desktop');
        return firebase.firestore().collection('subscribers').doc(t).set({
          created: firebase.firestore.FieldValue.serverTimestamp(),
          platform: platform,
          lang: (navigator.language || '').slice(0, 10)
        }).then(function(){ localStorage.setItem('pn_fs', t); })
          .catch(function(e){ if (e.code === 'permission-denied') localStorage.setItem('pn_fs', t); })
          .then(go);
      })
      .catch(go);
  } catch(e) { go(); }
})();
</script>
</body>
</html>
